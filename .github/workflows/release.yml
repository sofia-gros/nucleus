name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nucleus-windows-x86_64.zip
            asset_name: nucleus.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nucleus-macos-aarch64.zip
            asset_name: nucleus
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nucleus-linux-x86_64.tar.gz
            asset_name: nucleus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging/nucleus -Force
          Copy-Item target/${{ matrix.target }}/release/nucleus.exe staging/nucleus/
          if (Test-Path "plugins") { Copy-Item -Recurse plugins staging/nucleus/ }
          if (Test-Path "docs") { Copy-Item -Recurse docs staging/nucleus/ }
          Copy-Item README.md staging/nucleus/
          Compress-Archive -Path staging/nucleus/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging/nucleus
          cp target/${{ matrix.target }}/release/nucleus staging/nucleus/
          chmod +x staging/nucleus/nucleus
          if [ -d "plugins" ]; then cp -r plugins staging/nucleus/; fi
          if [ -d "docs" ]; then cp -r docs staging/nucleus/; fi
          cp README.md staging/nucleus/
          cd staging/nucleus && zip -r ../../${{ matrix.artifact_name }} ./*

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging/nucleus
          cp target/${{ matrix.target }}/release/nucleus staging/nucleus/
          chmod +x staging/nucleus/nucleus
          if [ -d "plugins" ]; then cp -r plugins staging/nucleus/; fi
          if [ -d "docs" ]; then cp -r docs staging/nucleus/; fi
          cp README.md staging/nucleus/
          tar -czvf ${{ matrix.artifact_name }} -C staging/nucleus .

      - name: Upload Artifact to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: "Nucleus IDE ${{ github.ref_name }}"
          draft: false
          prerelease: true
          generate_release_notes: true
