[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "0.11.0", features = ["tree-sitter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"

theme = { path = "crates/theme" }
i18n = { path = "crates/i18n" }
workspace = { path = "crates/workspace" }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2
