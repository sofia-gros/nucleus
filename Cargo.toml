[package]
name = "nucleus"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/nucleus-plugin-sdk"
]

[lib]
name = "nucleus"
path = "src/lib.rs"

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui_base = { git = "https://github.com/longbridge/gpui-component", package = "gpui-base" }
# Optional, for default bundled assets
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
wasmtime = "48.0.0"
serde_json = "1.0.151"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "6.0.0"
syntect = "5.2.0"
ropey = "1.6"
portable-pty = "0.8"
notify = "7.0"

[dev-dependencies]
criterion = "0.5"
inferno = "0.11"

[[bench]]
name = "benchmarks"
harness = false
