[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "0.11.0", features = [
    "tree-sitter", "tree-sitter-rust", "tree-sitter-toml", "tree-sitter-markdown", "tree-sitter-markdown-inline",
    "tree-sitter-yaml", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python",
    "tree-sitter-bash", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-html",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"
ignore = "0.4"
notify = "8"
futures = "0.3"
tempfile = "3"
nucleo-matcher = "0.3"

theme = { path = "crates/theme" }
i18n = { path = "crates/i18n" }
workspace = { path = "crates/workspace" }
project = { path = "crates/project" }
editor = { path = "crates/editor" }
settings = { path = "crates/settings" }
terminal = { path = "crates/terminal" }
extension_host = { path = "crates/extension_host" }
lsp = { path = "crates/lsp" }
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation", "cache", "addr2line"] }
wasmtime-wasi = "51"
lsp-types = { version = "0.97.0", features = ["proposed"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2
