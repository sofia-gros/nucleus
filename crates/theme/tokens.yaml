# Core Token（すべてのテーマが持つ色の変数）。このファイルが唯一の定義元。
# - key: gpui-kit の ThemeColor / highlight のキーと同じ名前にする。
#   `highlight.` で始まるものは gpui-kit の highlight テーマ（エディタとシンタックス）に、
#   それ以外は colors に渡す。
# - gpui: false のものは Nucleus だけが使う（gpui-kit には渡さない）。
# build.rs がここから `enum Token` を生成する。

# --- base ---
- { key: background,                 doc: "アプリ全体の背景" }
- { key: foreground,                 doc: "標準の文字色" }
- { key: border,                     doc: "境界線" }
- { key: muted.background,           doc: "控えめな面（入力欄の背景、セクション見出し）" }
